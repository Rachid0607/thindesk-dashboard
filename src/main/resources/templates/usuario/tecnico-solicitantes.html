<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/base}">
<head>
    <title>Solicitantes</title>
</head>
<body>
    <div layout:fragment="conteudo">
        <div class="page-header">
            <h1>Solicitantes</h1>
            <p>Lista somente leitura dos solicitantes cadastrados.</p>
        </div>

        <div class="card">
            <div class="empty-state" th:if="${#lists.isEmpty(solicitantes)}">
                <p>Nenhum solicitante cadastrado ainda.</p>
            </div>
            <div class="tabela-scroll" th:unless="${#lists.isEmpty(solicitantes)}">
                <table class="table">
                    <thead>
                        <tr><th>Nome</th><th>E-mail</th><th>Status</th></tr>
                    </thead>
                    <tbody>
                        <tr th:each="solicitante : ${solicitantes}">
                            <td th:text="${solicitante.nome}">Nome</td>
                            <td th:text="${solicitante.email}">email</td>
                            <td>
                                <span class="badge" th:class="${solicitante.ativo} ? 'badge badge-ativo' : 'badge badge-inativo'"
                                      th:text="${solicitante.ativo} ? 'Ativo' : 'Inativo'">Status</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>

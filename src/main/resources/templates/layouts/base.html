<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}">
    <title layout:title-pattern="$CONTENT_TITLE - $LAYOUT_TITLE" th:text="${appNome}">Thindesk</title>
    <link rel="icon" type="image/png" th:href="@{/images/icone.png}">
    <link rel="stylesheet" th:href="@{'/temas/' + ${appTema} + '/tema.css'}">
    <link rel="stylesheet" th:href="@{/css/layout.css}">
    <th:block layout:fragment="estilos"></th:block>
</head>
<body>
    <div class="app-shell">
        <div th:replace="~{fragments/menu :: menu}"></div>

        <div class="app-main">
            <div th:replace="~{fragments/cabecalho :: cabecalho}"></div>

            <main class="content">
                <div th:replace="~{fragments/mensagens :: mensagens}"></div>
                <div layout:fragment="conteudo">
                    <p>Conteudo da pagina.</p>
                </div>
            </main>

            <div th:replace="~{fragments/rodape :: rodape}"></div>
        </div>
    </div>
    <th:block layout:fragment="scripts"></th:block>
</body>
</html>
